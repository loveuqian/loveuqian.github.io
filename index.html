<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loveuqian 的小站</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    main {
      width: min(680px, calc(100% - 40px));
      padding: 56px 32px;
      box-sizing: border-box;
      text-align: center;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      box-shadow: 0 18px 50px rgba(31, 41, 55, 0.08);
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(32px, 7vw, 56px);
      letter-spacing: 0;
    }

    p {
      margin: 0 auto 28px;
      max-width: 460px;
      line-height: 1.8;
      color: #6b7280;
    }

    a {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 8px;
      background: #2563eb;
      color: #ffffff;
      text-decoration: none;
    }

    a:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <main>
    <h1>你好，欢迎来到我的小站</h1>
    <p>这里是一个正在慢慢成长的静态网页。以后会放上更多作品、想法和日常记录。</p>
    <a href="https://github.com/loveuqian">访问我的 GitHub</a>
  </main>
</body>
</html>
